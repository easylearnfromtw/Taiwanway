<style id="cert-output-slot-mask-fix">
/* Final slot-mask behavior: the certificate must never appear above the printer.
   The page remains hidden until it exits below the machine, giving a true print-out feel. */
.caf-output-window{position:absolute;z-index:3;top:118px;left:50%;transform:translateX(-50%);width:min(376px,76vw);height:calc(100% - 132px);overflow:hidden;pointer-events:none}
.caf-output-window .caf-paper{position:absolute!important;top:0!important;left:50%!important;width:100%!important;aspect-ratio:1086/1536;transform-origin:50% 0!important;translate:0 0!important;transform:translate(-50%,-101.5%) scale(.965)!important;animation:cafPaperFromOutputSlot 4.35s cubic-bezier(.22,.72,.2,1) .42s forwards!important}
.caf-output-window .caf-paper::after{animation:cafScan 3.45s linear .88s forwards!important}
.caf-output-window .caf-paper-inner,.caf-output-window .caf-paper-ink{animation:cafInkReveal 3.45s linear .88s forwards!important}
.caf-machine{z-index:6!important}
@keyframes cafPaperFromOutputSlot{0%,8%{transform:translate(-50%,-101.5%) scale(.965)}30%{transform:translate(-50%,-79%) scale(.965)}42%{transform:translate(-50%,-62%) scale(.965)}54%{transform:translate(-50%,-62%) scale(.965)}78%{transform:translate(-50%,-20%) scale(.965)}94%{transform:translate(-50%,-4%) scale(.965)}100%{transform:translate(-50%,2%) scale(.965)}}
@media(max-width:520px){.caf-output-window{top:102px;width:min(342px,82vw);height:calc(100% - 114px)}}
@media(prefers-reduced-motion:reduce){.caf-output-window .caf-paper{animation:none!important;transform:translate(-50%,2%) scale(.965)!important}}

/* ===== Reading lens clarity fix: keep magnified center optically clear ===== */
.lens{filter:drop-shadow(0 12px 20px rgba(0,0,0,.20))!important;}
.lens-view{
  background:var(--bg)!important;
  -webkit-backdrop-filter:none!important;
  backdrop-filter:none!important;
  filter:none!important;
}
.lens-clone{
  filter:none!important;
  opacity:1!important;
  -webkit-font-smoothing:antialiased;
  text-rendering:geometricPrecision;
}
/* Do not re-apply frosted-glass blur inside the cloned/magnified scene. */
.lens-clone .glass,
.lens-clone [style*="backdrop-filter"]{
  -webkit-backdrop-filter:none!important;
  backdrop-filter:none!important;
}
/* Reflection belongs on the rim, not over the optical center. */
.lens-ring{background:transparent!important;}
.lens-ring::before{
  left:24px!important;top:12px!important;width:48px!important;height:12px!important;
  opacity:.28!important;
}
</style>

<style id="xiantaiwen-aesthetic-upgrade-v3">
/* ================= AESTHETIC UPGRADE v3 =================
   Editorial Taiwan-modernism: quieter surfaces, stronger typography hierarchy,
   tactile controls, and cleaner mobile rhythm without changing brand colors. */
:root{
  --card-r:24px;
  --control-r:16px;
  --editorial-shadow:0 1px 0 rgba(255,255,255,.72) inset,0 18px 48px -32px rgba(31,42,35,.36),0 5px 16px -12px rgba(31,42,35,.20);
  --editorial-shadow-hover:0 1px 0 rgba(255,255,255,.8) inset,0 28px 62px -34px rgba(31,42,35,.43),0 8px 20px -14px rgba(31,42,35,.24);
}
body{
  background:
    radial-gradient(900px 520px at 9% -8%,rgba(243,191,83,.075),transparent 67%),
    radial-gradient(760px 460px at 94% 9%,rgba(23,75,58,.045),transparent 66%),
    var(--bg);
  letter-spacing:-.003em;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.21;
  background-image:radial-gradient(circle at center,rgba(32,35,33,.12) .45px,transparent .65px);
  background-size:5px 5px;mix-blend-mode:multiply;
}
:root[data-theme="dark"] body::before{opacity:.07;mix-blend-mode:screen}
.wrap{max-width:1200px}
.view{padding-top:34px}
.sec{margin-top:clamp(64px,8vw,92px)}
.sec-head{margin-bottom:26px;gap:20px}
.eyebrow{font-size:11.5px;letter-spacing:.155em;opacity:.92}
.h1{letter-spacing:-.048em;text-wrap:balance}
.h2{letter-spacing:-.038em;text-wrap:balance}
.h3{letter-spacing:-.022em}
.lede{line-height:1.7;letter-spacing:-.006em}

.card{
  border-radius:var(--card-r);
  border-color:color-mix(in srgb,var(--line) 84%,var(--text) 4%);
  box-shadow:var(--editorial-shadow);
}
@media (hover:hover) and (pointer:fine){
  a.card:hover,button.card:hover{transform:translateY(-4px);box-shadow:var(--editorial-shadow-hover)}
}

.nav{
  height:64px;border-radius:24px;padding-inline:15px 11px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.76),0 18px 42px -24px rgba(25,38,31,.34),0 3px 10px -7px rgba(25,38,31,.20);
}
.logo{gap:11px}.logo-t b{letter-spacing:-.045em}.logo-t small{letter-spacing:.145em}
.nav-right{gap:3px}.icon-btn{transition:background .2s,scale .26s var(--spring),color .2s,box-shadow .2s}
.icon-btn:not(:disabled):active{scale:.91}

.btn,.btn-hero,.chip-btn,.known,.ac-fav,.ac-switch{
  -webkit-tap-highlight-color:transparent;
}
.btn{font-weight:750;letter-spacing:-.012em;box-shadow:0 1px 0 rgba(255,255,255,.5) inset}
.btn.ghost{background:color-mix(in srgb,var(--paper) 90%,transparent);box-shadow:0 1px 0 rgba(255,255,255,.65) inset,0 6px 16px -14px rgba(20,35,28,.45)}
.btn.pri{box-shadow:inset 0 1px 0 rgba(255,255,255,.23),0 11px 25px -17px rgba(23,75,58,.88)}
button:not(:disabled):active,.btn:not(:disabled):active,.chip-btn:not(:disabled):active{filter:brightness(.965)}

/* Cards read as editorial objects rather than generic boxes. */
.cat-card,.sit-card,.ph-card,.diff-card,.panel,.daily,.ac-compose,.ac-src,.ac-lesson{
  border-color:color-mix(in srgb,var(--line) 88%,var(--accent) 5%);
}
.cat-card h3,.sit-card h3,.ph-card .zh,.art-meta h3{letter-spacing:-.025em}
.chip{border-color:color-mix(in srgb,var(--line) 86%,transparent);box-shadow:inset 0 1px rgba(255,255,255,.55)}

/* Phrase blocks: more breathing room and less visual competition between layers. */
.phr{row-gap:3px}
.phr .zh{letter-spacing:.018em}
.phr .py{opacity:.9}.phr .zy{opacity:.86}.phr .en{opacity:.88;line-height:1.55}
.tri-mini{line-height:1.45}

/* About teaser — mobile-first editorial treatment. */
.about-home{
  position:relative;isolation:isolate;overflow:hidden;
  background:
    radial-gradient(420px 260px at 93% 8%,rgba(243,191,83,.12),transparent 64%),
    linear-gradient(145deg,color-mix(in srgb,var(--paper) 97%,var(--accent) 3%),var(--paper));
  border-color:color-mix(in srgb,var(--line-2) 74%,var(--accent) 12%);
}
.about-home::after{
  content:"";position:absolute;left:0;top:30px;bottom:30px;width:3px;border-radius:9px;
  background:linear-gradient(var(--red),var(--yellow));opacity:.86;z-index:-1;
}
.about-home .eyebrow{color:var(--accent-text)}
.about-home .h2{font-weight:800;letter-spacing:-.048em;line-height:1.04}
.about-home .tri-mini{padding-left:14px;border-left:1px solid color-mix(in srgb,var(--line-2) 82%,var(--accent) 18%)}
.about-home-people{filter:saturate(.94)}
.about-home-people i{box-shadow:0 10px 25px -16px rgba(32,35,33,.45)}

/* Culture / reading polish. */
.culture-editorial .art-card,.culture-grid .art-card{overflow:hidden}
.art-meta{padding:22px 22px 23px}
.art-meta h3{line-height:1.22}
.art-body{font-feature-settings:"palt" 1,"kern" 1}
.art-body p{line-height:1.9}
.art-sec h2{font-family:var(--f-zh-serif);letter-spacing:.015em;line-height:1.28}

/* Quiz / challenge interaction reads clearer at a glance. */
.qopt,.dopt,.gopt{
  border-width:1px;box-shadow:0 6px 18px -17px rgba(24,38,31,.5);
  transition:transform .22s var(--spring),border-color .18s,background .18s,box-shadow .18s;
}
@media (hover:hover) and (pointer:fine){.qopt:hover,.dopt:hover,.gopt:hover{box-shadow:0 12px 26px -18px rgba(24,38,31,.5)}}
.qopt:active,.dopt:active,.gopt:active{transform:scale(.988)}

/* Bottom navigation: slightly more compact, stronger active state. */
.tabbar{padding:5px;border:1px solid var(--glass-edge);box-shadow:inset 0 1px rgba(255,255,255,.78),0 18px 42px -25px rgba(20,34,27,.48)}
.tabbar .gs-row>button{border-radius:999px}.tabbar .ti{font-weight:800}.tabbar .tl{font-weight:700}

/* Audio controls feel intentional. */
.play{box-shadow:inset 0 1px rgba(255,255,255,.22),0 8px 18px -13px rgba(23,75,58,.72)}
.play.loading{cursor:progress}
.play.loading svg{animation:audioPulse 1s ease-in-out infinite}
@keyframes audioPulse{50%{opacity:.42;scale:.88}}

/* Focus state is visible but not visually heavy. */
:focus-visible{outline:2px solid color-mix(in srgb,var(--accent-text) 78%,white 22%);outline-offset:3px}

@media(max-width:920px){
  body{padding-inline:14px;padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
  .view{padding-top:24px}.sec{margin-top:58px}.sec-head{margin-bottom:20px}
  .nav{width:calc(100% - 8px);margin-top:8px;height:58px;border-radius:20px;padding-inline:11px 7px}
  .logo-t b{font-size:18px}.logo-t small{font-size:9.5px}
  .tabbar{width:min(455px,calc(100% - 20px));bottom:calc(env(safe-area-inset-bottom,0px) + 9px)}
}
@media(max-width:520px){
  body{padding-inline:12px}
  .card{border-radius:22px}
  .h1{font-size:clamp(36px,11vw,50px)}
  .h2{font-size:clamp(27px,8vw,34px)}
  .lede{font-size:15.5px;line-height:1.68}
  .about-home{padding:26px 23px 28px!important;gap:24px!important}
  .about-home::after{top:27px;bottom:27px;width:2.5px}
  .about-home .h2{font-size:clamp(30px,9.3vw,37px)!important;max-width:15ch!important;margin-top:13px!important}
  .about-home .tri-mini{padding-left:12px!important;margin-top:9px!important}
  .about-home .phr{margin-top:15px!important}
  .about-home-people{padding-top:5px!important;gap:0!important}
  .about-home-people i{width:44px!important;height:44px!important;border-radius:14px!important;margin-left:-6px!important}
  .btn{font-size:14.5px}
  .qopt,.dopt,.gopt{border-radius:17px}
}
@media(prefers-reduced-motion:reduce){
  .play.loading svg{animation:none}
  .card,.btn,.icon-btn,.qopt,.dopt,.gopt{transition-duration:.01ms!important}
}
</style>



<style id="xiantaiwen-final-system-polish-v1">

html{scroll-padding-top:94px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-kerning:normal;font-synthesis:none;text-rendering:optimizeLegibility}
:where(.zh,.tz,.serif-zh,.cng-name,.csm-award,.csm-name,.caf-dyn-award,.caf-dyn-name){font-feature-settings:"palt" 1,"kern" 1}

/* Consistent readable widths and rhythm. */
.view>.mast,.view>.sec-head,.reading .sheet,.privacy-layout{min-width:0}
.sec-head>div,.teaser-copy,.csm-copy,.cng-body,.ac-tierhead>div{min-width:0}
.h1,.h2,.h3,.lede,.phr .zh,.phr .en{overflow-wrap:break-word}

/* Buttons: one tactile system across desktop and mobile. */
.btn,.btn-hero,.chip-btn,.icon-btn,.play,.known,.ac-switch,.ac-fav{touch-action:manipulation}
.btn,.chip-btn{min-height:44px}
.btn.sm{min-height:38px}
.icon-btn,.play{min-width:42px;min-height:42px}
@media(hover:hover) and (pointer:fine){
  .btn:not(:disabled):hover,.chip-btn:not(:disabled):hover{translate:0 -1px}
  .icon-btn:not(:disabled):hover{scale:1.035}
}

/* Form polish and explicit 6-character certificate-name behavior. */
.profile-name-field>input,.cng-field input{caret-color:var(--accent);text-wrap:nowrap}
.cng-field input{min-height:58px;font-size:clamp(22px,5vw,28px);letter-spacing:.075em}
.cng-field-head{min-height:24px}
.cng-count{font-variant-numeric:tabular-nums}
.cng-preview{min-height:54px}
.cng-preview strong{max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Certificate claim card feels like a milestone rather than a warning. */
.cert-claim{position:relative;overflow:hidden;border-style:solid!important;background:linear-gradient(135deg,color-mix(in srgb,var(--paper) 97%,var(--tc,#174B3A) 3%),var(--paper))}
.cert-claim::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--tc,#174B3A);opacity:.9}
.cert-claim .cc-seal{box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),0 9px 20px -16px rgba(0,0,0,.4)}

/* Print ritual status and official certificate text remain precisely centered. */
.caf-dyn-award,.caf-dyn-name,.csm-award,.csm-name,.cert-template-award,.cert-template-name{
  font-family:'Noto Serif TC','Songti TC','PMingLiU',serif!important;
  font-weight:700!important;font-kerning:normal!important;text-rendering:geometricPrecision;
  letter-spacing:.025em!important;line-height:1!important;
}
.caf-dyn-award,.csm-award,.cert-template-award{padding-inline:5%!important}
.caf-dyn-name,.csm-name,.cert-template-name{padding-inline:7%!important}
.caf-status-card{box-shadow:0 18px 38px -28px rgba(0,0,0,.42),inset 0 1px rgba(255,255,255,.9)}
.caf-step{letter-spacing:.015em!important}
.caf-pct{font-variant-numeric:tabular-nums}

/* Completion modal: same editorial language as the site. */
.cert-save-modal{overscroll-behavior:contain}
.csm-card{position:relative;isolation:isolate;overflow:hidden}
.csm-card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:linear-gradient(var(--red),var(--yellow));opacity:.92;z-index:-1}
.csm-preview{border-radius:12px;box-shadow:0 28px 58px -34px rgba(41,32,23,.55),0 2px 8px -5px rgba(41,32,23,.22)}
.csm-preview::after{content:"正式證書預覽";position:absolute;right:10px;bottom:10px;padding:5px 8px;border-radius:999px;background:rgba(255,253,248,.88);border:1px solid rgba(110,95,75,.16);color:#665d52;font:700 9px/1 var(--f-ui);letter-spacing:.08em;backdrop-filter:blur(8px)}
.csm-title{text-wrap:balance}
.csm-meta span{min-height:68px;align-content:center}
.csm-save-state{margin-top:10px;min-height:20px;color:var(--muted);font:600 11.5px/1.55 var(--f-zh)}
.csm-actions .btn{min-height:50px}
.csm-actions .csm-return{background:transparent;border-color:transparent;box-shadow:none;color:var(--muted)}
.csm-actions .csm-return:hover{background:var(--paper-2);color:var(--text)}
.csm-saving .csm-actions .btn:not([aria-busy="true"]){opacity:.56}
.csm-actions [aria-busy="true"]{cursor:progress}

/* Return congratulations: short, premium, non-blocking. */
.cert-return-congrats{border-radius:24px;border-color:color-mix(in srgb,var(--line) 75%,var(--accent) 12%);box-shadow:0 22px 50px -28px rgba(18,40,30,.42),inset 0 1px rgba(255,255,255,.76)}
.crc-copy b{letter-spacing:-.018em}.crc-copy span{line-height:1.55}

/* Privacy and About long-form content stays calm on narrow screens. */
.privacy-sec p,.privacy-sec li,.about-manifesto-copy .phr .zh,.about-manifesto-copy .phr .en{max-width:72ch}

/* Bottom-tab safe area and no modal/background fighting. */
html.xw-modal-open,html.xw-modal-open body,html.xtw-friend-lock,html.xtw-friend-lock body{overflow:hidden!important;overscroll-behavior:none}
@media(max-width:720px){
  .cert-save-modal{place-items:start center;padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(18px,env(safe-area-inset-bottom))}
  .csm-card{grid-template-columns:1fr!important;width:min(520px,100%);gap:20px;padding:20px 18px 18px;border-radius:28px}
  .csm-preview{width:min(64vw,255px)}
  .csm-title{font-size:clamp(29px,8.7vw,40px);margin-top:10px}
  .csm-lede{font-size:14px;line-height:1.72}
  .csm-meta{margin:17px 0 13px}

  .csm-actions .btn{width:100%}
  .cert-return-congrats{top:max(70px,calc(env(safe-area-inset-top) + 54px));width:calc(100vw - 22px)}
  .cng-card{max-height:calc(100svh - 28px);overflow:auto;border-radius:26px}

  .cng-top{grid-template-columns:46px 1fr;gap:12px;padding-top:21px;padding-bottom:16px}

}

@media(prefers-reduced-motion:reduce){
  .csm-card,.cert-return-congrats,.cng-card{transition-duration:.01ms!important}
}
</style>
<script id="xiantaiwen-final-modal-ux-v1">
(()=>{'use strict';
  const root=document.documentElement;
  const syncModalLock=()=>{const open=!!document.querySelector('.cert-save-modal,.cert-name-gate,.cert-award-fx');root.classList.toggle('xw-modal-open',open)};
  const mo=new MutationObserver(syncModalLock);mo.observe(document.documentElement,{childList:true,subtree:true});syncModalLock();
  document.addEventListener('keydown',e=>{
    if(e.key!=='Tab')return;
    const modal=document.querySelector('.cert-save-modal.in,.cert-name-gate.in');if(!modal)return;
    const items=[...modal.querySelectorAll('button:not([disabled]),input:not([disabled]),a[href]')].filter(x=>x.offsetParent!==null);if(items.length<2)return;
    const first=items[0],last=items[items.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
  });
})();
</script>

<script id="xiantaiwen-semantic-ui-sfx-v3">
(()=>{
  'use strict';
  const speechSel = [
    '.play','[data-act="say"]','[data-act="zy"]',
    '[data-ac="voice"]','[data-ac="readsrc"]','[data-wl="test"]'
  ].join(',');
  const handledSel = [
    '.gopt','[data-ac="answer"]','[data-ac="hit"]',
    '[data-ac="esubmit"]','[data-ac="battle"]',
    '[data-dq="claim"]'
  ].join(',');

  function kindFor(el){
    if(!el || el.disabled || el.getAttribute('aria-disabled')==='true') return '';
    if(el.matches(speechSel)) return '';                 // the voice itself is the foreground audio
    if(el.matches(handledSel)) return '';                // these already emit answer/card/battle/reward feedback
    const a=el.dataset.act||'', ac=el.dataset.ac||'', dq=el.dataset.dq||'', wl=el.dataset.wl||'';
    if(a==='fcflip') return 'card';
    if(dq==='chest') return 'key';
    if(/^(known|star)$/.test(a) || ac==='fav') return 'correct';
    if(/^(reset-yes)$/.test(a)) return 'wrong';
    if(/^(share|search|sclose|theme|lang|lens|top|scrollto|go|sgo|cat|dfilter|ltab|dopen|toc|afs|qnext|qagain|fcnext|fcagain|reset|reset-no|zyjump|sq|welcome|privacy-print)$/.test(a)) return 'scan';
    if(/^(music|name|person|person-close|print|etab|ereset)$/.test(ac)) return 'scan';
    if(/^(goal|back|next|skip)$/.test(wl)) return 'scan';
    if(el.dataset.sh || el.dataset.shp) return 'scan';
    if(el.id==='sound-ready' || el.id==='sound-later') return 'scan';
    return 'scan';                                       // every remaining real button gets subtle feedback
  }

  document.addEventListener('click',(e)=>{
    const el=e.target.closest('button,[role="button"],a.btn,a.btn-hero,.chip-btn');
    if(!el) return;
    try{
      if(!window.Soundscape) return;
      window.Soundscape.enableFromGesture();

      // Standard Quiz buttons did not previously emit answer feedback. The main
      // quiz handler runs earlier on document and has already painted right/wrong.
      if(el.matches('.qopt,[data-act="qopt"]')){
        window.Soundscape.sfx(el.classList.contains('right')?'correct':'wrong',el.classList.contains('right')?.16:.14);
        return;
      }
      // The home demo rebuilds itself immediately, so derive feedback from its
      // data-k before the detached node disappears (A / 0 is the intended choice).
      if(el.matches('.dopt[data-act="demo"],[data-act="demo"]')){
        window.Soundscape.sfx(+el.dataset.k===0?'correct':'wrong',+el.dataset.k===0?.14:.12);
        return;
      }
      if(el.id==='sound-later') return; // respecting “later” means staying silent

      const kind=kindFor(el); if(!kind) return;
      // Navigation should be tactile, not noisy. Rewards/cards remain slightly stronger.
      const vol=kind==='scan'?.075:kind==='correct'?.11:kind==='wrong'?.10:kind==='card'?.12:.13;
      window.Soundscape.sfx(kind,vol);
    }catch(_){/* audio feedback must never block UI */}
  },false);
})();
</script>

<script id="mobile-scroll-recovery-v6-runtime">
(()=>{'use strict';
  const root=document.documentElement, body=document.body;
  const shareOpen=()=>{const n=document.getElementById('share');return !!(n&&!n.hidden)};
  const welcomeOpen=()=>!!document.querySelector('#welcome.wl');
  const certOpen=()=>!!document.querySelector('.cert-save-modal,.cert-name-gate,.cert-award-fx');
  const friendOpen=()=>!!document.querySelector('.xtw-friend-ov');
  let raf=0;
  function repair(){
    raf=0;
    const wl=welcomeOpen(), sh=shareOpen(), cert=certOpen(), fr=friendOpen();
    if(!wl){root.classList.remove('wl-lock');document.querySelectorAll('#app,.nav,.tabbar').forEach(n=>{try{n.inert=false}catch(_){}})}
    if(!sh)root.classList.remove('sh-lock');
    if(!cert)root.classList.remove('xw-modal-open');
    if(!fr)root.classList.remove('xtw-friend-lock');
    if(!fr && body.style.getPropertyValue('overflow')) body.style.removeProperty('overflow');
    if(!(wl||sh||cert||fr)){
      root.style.removeProperty('overflow');body.style.removeProperty('overflow');body.style.removeProperty('touch-action');body.style.removeProperty('position');
    }
  }
  const schedule=()=>{if(!raf)raf=requestAnimationFrame(repair)};
  new MutationObserver(schedule).observe(body,{subtree:true,childList:true,attributes:true,attributeFilter:['class','hidden','style']});
  ['pageshow','hashchange','popstate','orientationchange','resize'].forEach(ev=>addEventListener(ev,schedule,{passive:true}));
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)schedule()},{passive:true});
  document.addEventListener('touchstart',schedule,{passive:true,capture:true});
  document.addEventListener('pointerdown',schedule,{passive:true,capture:true});
  setTimeout(repair,0);setTimeout(repair,900);
  window.XTWRepairScroll=repair;
})();
</script>

<script id="mobile-horizontal-lock-v4">
(()=>{
  /*
    Do not call scrollTo() from the scroll event itself. On iOS Safari that can
    interrupt vertical momentum scrolling. CSS owns the X-axis lock; this is
    only a defensive X reset after viewport changes / completed gestures.
  */
  const snapX=()=>{
    if(innerWidth<=820 && Math.abs(window.scrollX||0)>.5){
      window.scrollTo(0, window.scrollY||0);
    }
  };
  addEventListener('pageshow',()=>requestAnimationFrame(snapX),{passive:true});
  addEventListener('resize',()=>requestAnimationFrame(snapX),{passive:true});
  document.addEventListener('touchend',()=>requestAnimationFrame(snapX),{passive:true});
})();
</script>

<!-- =========================================================
  XIANTAIWEN RELEASE POLISH v1
  Final non-destructive visual/responsive/accessibility layer.
  Keeps game/state logic intact and consolidates presentation.
========================================================== -->
<style id="xiantaiwen-release-polish-v1">
:root{
  --release-radius:22px;
  --release-radius-sm:15px;
  --release-touch:44px;
  --release-measure:1180px;
  --release-reading:72ch;
}
html{
  scroll-padding-top:calc(84px + env(safe-area-inset-top,0px));
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
body{
  padding-left:max(14px,env(safe-area-inset-left,0px))!important;
  padding-right:max(14px,env(safe-area-inset-right,0px))!important;
}
#app{
  width:100%;
  min-height:calc(100svh - 80px);
  margin-inline:auto;
}
#app>.view,
#app>.view.wrap{
  width:100%;
  min-width:0;
  margin-inline:auto!important;
}
#app>.view.wrap{max-width:var(--release-measure)!important}
.view{padding-bottom:56px}

/* consistent vertical rhythm */
.sec-head{
  width:100%;
  align-items:center;
  gap:18px;
  margin-bottom:16px;
}
.sec-head>div{min-width:0}
.sec-head .h2,.sec-head .h3,.sec-head h1,.sec-head h2{overflow-wrap:anywhere}
.sec{scroll-margin-top:calc(92px + env(safe-area-inset-top,0px))}

/* cards: same geometry and cleaner edge hierarchy */
.card,
.panel,
.title-vault,
.special-items,
.profile-id-card{
  border-radius:var(--release-radius);
}
.card{
  border-color:color-mix(in srgb,var(--line) 88%,transparent);
}
.card,.panel{
  min-width:0;
}
.card p,.panel p{overflow-wrap:anywhere}

/* controls: mobile-safe hit areas and keyboard focus */
button,
[role="button"],
.btn,
.icon-btn,
summary,
a[data-act]{
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.btn{min-height:var(--release-touch);align-items:center;justify-content:center}
.btn.sm{min-height:40px}
.icon-btn{min-width:var(--release-touch);min-height:var(--release-touch)}
button:focus-visible,
a:focus-visible,
summary:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
[tabindex]:focus-visible{
  outline:2.5px solid var(--accent-text);
  outline-offset:3px;
}
button:disabled,.btn[aria-disabled="true"]{cursor:not-allowed}
input,select,textarea{max-width:100%;min-width:0}

/* profile / titles / collections */
.profile-view{margin-inline:auto!important}
.profile-id-card,.prof-head,.title-vault,.special-items{width:100%;margin-inline:auto!important}
.prof-head{align-items:center}
.profile-name-field{min-width:0;max-width:680px}
.profile-name-help,.profile-name-help-en{max-width:var(--release-reading)}
.title-vault-summary{min-height:70px}
.title-vault-summary-right{min-width:0}
.title-vault-summary-right .active-title{overflow:hidden;text-overflow:ellipsis}
.title-grid,.special-item-grid,.egg-badge-grid,.egg-item-grid{min-width:0}
.title-card,.special-item,.egg-badge-card,.egg-item-card{min-width:0}
.item-lore>summary,.egg-item-lore>summary{min-height:40px;align-items:center}
.item-lore-body,.egg-item-lore p{max-width:var(--release-reading)}

/* readable long-form copy */
.privacy-doc p,
.privacy-sub,
.article-body p,
.ac-dragon-guide p,
.pid-note span{
  text-wrap:pretty;

<script id="github-pages-hard-watchdog">

  function releaseWelcomeLoader(){
    if(window.XTW_BOOT)return;

    var loader=w.querySelector('.wl-loader');
    if(loader && !w.classList.contains('ready')){

      var c=w.querySelector('.wl-count b'); if(c)c.textContent='100';
    }
  }
  setTimeout(function(){if(window.XTW_BOOT){window.XTW_BOOT.mark(24);}else releaseBoot();},5000);
  setTimeout(releaseWelcomeLoader,1800);
  window.addEventListener('pageshow',function(){setTimeout(function(){if(window.XTW_BOOT){window.XTW_BOOT.mark(24);}else releaseBoot();},5000);setTimeout(releaseWelcomeLoader,4200)});
})();

    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    let n;
    while((n=walker.nextNode())){
      const v=(n.nodeValue||'').trim();
      if(v==='\\n'||v==='/n') n.nodeValue='';
    }
  };
  const refresh=()=>{sync();scrub(app||document.body)};
  refresh();
  if(app){
    new MutationObserver(refresh).observe(app,{childList:true,subtree:true});
  }

})();

<script id="persistent-bgm-recovery-v15">
(()=>{
  'use strict';
  const kick=()=>{
    try{
      localStorage.setItem('xiantaiwen-sound-enabled','1');
      localStorage.setItem('xiantaiwen-bgm-required-v2','1');
    }catch(_){ }
    try{
      if(window.Soundscape){
        window.Soundscape.enableFromGesture();
      }
    }catch(_){ }
  };
  /* iOS/Safari only guarantees audio unlock while still inside the real gesture.
     Keep this lightweight retry active so returning from another app/tab also recovers BGM. */
  ['pointerdown','touchstart','mousedown','click','keydown'].forEach(ev=>{
    document.addEventListener(ev,kick,{capture:true,passive:true});
  });
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(kick,0)},{passive:true});
  addEventListener('pageshow',()=>setTimeout(kick,0),{passive:true});
})();
</script>

<script id="dragon-lockdown-victory-controller-v3">
const DragonLockdown=(()=>{
  let overlay=null,arenaPass=false,launchToken=0,launching=false;
  const route=()=>{try{return window.TaiWanWayCurrentRoute?window.TaiWanWayCurrentRoute():null;}catch(_){return null;}};
  function status(){try{return window.TaiWanWayDragonStatus?window.TaiWanWayDragonStatus():null;}catch(_){return null;}}
  function remove(){if(overlay){overlay.remove();overlay=null;}}
  function show(){
    if(launching)return;
    if(overlay&&document.body.contains(overlay))return;
    remove();
    overlay=document.createElement('div');
    overlay.className='dragon-lockdown';
    overlay.setAttribute('role','dialog');
    overlay.setAttribute('aria-modal','true');
    overlay.setAttribute('aria-labelledby','dragon-lock-title');
    overlay.innerHTML=`<div class="dl-card"><span class="dl-kicker">FINAL BOSS EMERGENCY</span><h2 class="dl-title" id="dragon-lock-title">魔龍降臨</h2><p class="dl-line">淒淒慘慘戚戚</p><p class="dl-sub">條件已經達成。按下後會直接進入正式魔龍戰。<br><small>One tap takes you straight into the playable Graduation Dragon battle.</small></p><button type="button" class="btn-hero pri dl-enter"><span>傳送魔龍戰場</span><i class="orb">→</i></button></div>`;
    overlay.querySelector('.dl-enter').onclick=launch;
    document.body.appendChild(overlay);
    try{window.Soundscape&&window.Soundscape.sfx('boss',.18);}catch(_){}
  }
  function launch(){
    if(launching)return;
    const token=++launchToken;
    launching=true;arenaPass=true;
    const btn=overlay&&overlay.querySelector('.dl-enter');
    if(btn){btn.disabled=true;btn.setAttribute('aria-busy','true');const sp=btn.querySelector('span');if(sp)sp.textContent='進入戰場…';}
    // Remove the fullscreen blocker before rendering the arena. The battle engine
    // is invoked directly; no synthetic button click and no animation wait loop.
    requestAnimationFrame(()=>{
      remove();
      let ok=false;
      try{ok=!!(window.TaiWanWayEnterDragonBattle&&window.TaiWanWayEnterDragonBattle({skipIntro:true,source:'lockdown'}));}catch(_){}
      if(ok){launching=false;arenaPass=false;return;}
      // Very short compatibility retry in case the deferred app API finished on
      // the same frame as this click. This never leaves a blocking overlay behind.
      setTimeout(()=>{
        if(token!==launchToken)return;
        try{ok=!!(window.TaiWanWayEnterDragonBattle&&window.TaiWanWayEnterDragonBattle({skipIntro:true,source:'lockdown-retry'}));}catch(_){}
        launching=false;arenaPass=false;
        if(!ok){
          try{location.hash='#academy.dragon';}catch(_){}
          setTimeout(()=>{if(status()?.eligible&&!status()?.battle&&!status()?.won)show();},180);
        }
      },80);
    });
  }
  function sync(r=route()){
    const st=status();
    if(!st||!st.eligible||st.won){arenaPass=false;launching=false;remove();return;}
    if(launching)return;
    const onArena=r&&r.v==='academy'&&r.id==='dragon';
    if(onArena&&(arenaPass||st.battle)){remove();return;}
    show();
  }
  return {sync,launch,remove};
})();
window.DragonLockdown=DragonLockdown;
setTimeout(()=>DragonLockdown.sync(),0);
</script>

<script id="pastel-dragon-boss-system-v1" type="text/plain" data-deferred="visual">
(() => {
  'use strict';
  const IMAGES = {
  "neutral": "assets/dragon-webp/neutral.webp",
  "curious": "assets/dragon-webp/curious.webp",
  "thinking": "assets/dragon-webp/thinking.webp",
  "wink": "assets/dragon-webp/wink.webp",
  "sideeye": "assets/dragon-webp/sideeye.webp",
  "sleepy": "assets/dragon-webp/sleepy.webp",
  "pout": "assets/dragon-webp/pout.webp",
  "annoyed": "assets/dragon-webp/annoyed.webp",
  "surprised": "assets/dragon-webp/surprised.webp",
  "pleading": "assets/dragon-webp/pleading.webp",
  "angry": "assets/dragon-webp/angry.webp",
  "sad": "assets/dragon-webp/sad.webp",
  "crying": "assets/dragon-webp/crying.webp",
  "sick": "assets/dragon-webp/sick.webp",
  "playful": "assets/dragon-webp/playful.webp"
};
  const MANIFEST = {"neutral": {"weight": 9, "minHold": 2400, "maxHold": 4800, "rare": false, "next": ["neutral", "curious", "thinking", "sleepy", "sideeye", "surprised", "playful", "pout", "wink", "pleading"]}, "curious": {"weight": 5, "minHold": 1400, "maxHold": 2800, "rare": false, "next": ["thinking", "neutral", "surprised", "wink"]}, "thinking": {"weight": 5, "minHold": 1500, "maxHold": 2800, "rare": false, "next": ["neutral", "curious", "sideeye", "surprised"]}, "wink": {"weight": 3, "minHold": 1200, "maxHold": 2200, "rare": false, "next": ["neutral", "playful", "curious"]}, "sideeye": {"weight": 4, "minHold": 1400, "maxHold": 2600, "rare": false, "next": ["neutral", "thinking", "annoyed", "pout"]}, "sleepy": {"weight": 4, "minHold": 1600, "maxHold": 3000, "rare": false, "next": ["neutral", "sick", "pout"]}, "pout": {"weight": 3, "minHold": 1300, "maxHold": 2300, "rare": false, "next": ["neutral", "annoyed", "angry"]}, "annoyed": {"weight": 2, "minHold": 1300, "maxHold": 2200, "rare": false, "next": ["neutral", "pout", "angry"]}, "surprised": {"weight": 3, "minHold": 1200, "maxHold": 2200, "rare": false, "next": ["neutral", "curious", "pleading"]}, "pleading": {"weight": 2, "minHold": 1400, "maxHold": 2400, "rare": true, "next": ["sad", "neutral"]}, "sad": {"weight": 2, "minHold": 1400, "maxHold": 2400, "rare": true, "next": ["neutral", "crying"]}, "crying": {"weight": 1, "minHold": 1000, "maxHold": 1700, "rare": true, "next": ["sad", "neutral"]}, "angry": {"weight": 2, "minHold": 1200, "maxHold": 2100, "rare": true, "next": ["neutral", "annoyed"]}, "sick": {"weight": 1, "minHold": 1400, "maxHold": 2300, "rare": true, "next": ["sleepy", "neutral"]}, "playful": {"weight": 2, "minHold": 1100, "maxHold": 2100, "rare": false, "next": ["neutral", "wink", "curious"]}};
  const BLINK = "assets/dragon-webp/blink.webp";
  const REDUCE_PD = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const FIXED_EXPR = 'neutral'; // 固定表情：保留眨眼與呼吸，不再切換臉部表情

  const PHASE = {
    normal: {
      pool:['neutral','curious','thinking','sideeye','surprised','playful','wink'],
      base:'neutral', min:1900, max:3900
    },
    angry: {
      pool:['annoyed','pout','angry','sideeye'],
      base:'annoyed', min:1150, max:2200
    },
    rage: {
      pool:['angry','annoyed','pout'],
      base:'angry', min:800, max:1500
    },
    cry: {
      pool:['crying','sad','pleading','sleepy'],
      base:'crying', min:1100, max:2100
    }
  };

  const instances = new WeakMap();
  const preloadIds = ['neutral'];
  preloadIds.forEach(id => { try { const im = new Image(); im.src = IMAGES[id]; } catch(_) {} });

  const rand=(a,b)=>Math.floor(a+Math.random()*(b-a));
  const phaseFromClass=(el)=>el.classList.contains('mode-cry')?'cry':el.classList.contains('mode-rage')?'rage':el.classList.contains('mode-angry')?'angry':'normal';

  class PastelDragon {
    constructor(host, kind='battle') {
      this.host=host; this.kind=kind; this.phase=kind==='intro'?'normal':phaseFromClass(host);
      this.active=0; this.current='neutral'; this.transitioning=false; this.reacting=false;
      this.exprTimer=null; this.blinkTimer=null; this.reactionTimer=null;
      this.wasHurt=false; this.wasShield=false;
      host.classList.add('pastel-dragon-mounted');
      host.dataset.pdPhase=this.phase;
      host.innerHTML = `
        <div class="pd-stage" aria-hidden="true">
          <div class="pd-expr on" data-pd-layer="0"><img class="pd-main" alt=""><img class="pd-chest" alt=""><img class="pd-belly" alt=""></div>
          <div class="pd-expr" data-pd-layer="1"><img class="pd-main" alt=""><img class="pd-chest" alt=""><img class="pd-belly" alt=""></div>
          <div class="pd-blink"><img class="pd-blink-eyes" alt=""></div>
        </div>`;
      this.layers=[...host.querySelectorAll('.pd-expr')].map(el=>({
        el, main:el.querySelector('.pd-main'), chest:el.querySelector('.pd-chest'), belly:el.querySelector('.pd-belly')
      }));
      this.blink=host.querySelector('.pd-blink');
      this.blinkImg=host.querySelector('.pd-blink-eyes');
      this.blinkImg.src=BLINK;
      this.current=FIXED_EXPR;
      this.setLayer(this.layers[0],FIXED_EXPR);
      this.setLayer(this.layers[1],FIXED_EXPR);
      // 表情固定；只保留自然眨眼與原有呼吸／戰鬥動態。
      this.scheduleBlink();
    }
    phaseMeta() { return PHASE[this.phase]||PHASE.normal; }
    setLayer(layer,id) {
      const src=IMAGES[id]||IMAGES.neutral;
      layer.main.src=src; layer.chest.src=src; layer.belly.src=src; layer.el.dataset.expr=id;
    }
    pick() {
      const meta=this.phaseMeta(), pool=meta.pool.filter(x=>IMAGES[x]);
      if(!pool.length) return meta.base;
      let next=pool[Math.floor(Math.random()*pool.length)];
      if(next===this.current && pool.length>1 && Math.random()<.72) next=pool[(pool.indexOf(next)+1+Math.floor(Math.random()*(pool.length-1)))%pool.length];
      return next;
    }
    fadeTo(id,duration=rand(240,390),after=null) {
      if(!this.host.isConnected) return;
      if(!IMAGES[id]) id='neutral';
      if(this.transitioning && duration>0) return;
      clearTimeout(this.exprTimer);
      const from=this.layers[this.active], to=this.layers[1-this.active];
      this.setLayer(to,id);
      const d=REDUCE_PD?0:Math.max(0,duration);
      to.el.style.transitionDuration=d+'ms'; from.el.style.transitionDuration=d+'ms';
      this.transitioning=true;
      requestAnimationFrame(()=>{
        to.el.classList.add('on'); from.el.classList.remove('on');
        setTimeout(()=>{
          if(!this.host.isConnected) return;
          this.active=1-this.active; this.current=id; this.transitioning=false;
          if(after) after();
          if(!this.reacting && this.kind!=='intro') this.scheduleExpr();
        },d+24);
      });
    }
    scheduleExpr() {
      clearTimeout(this.exprTimer);
      // 固定表情模式：不進行任何自動表情輪替。
      return;
    }
    blinkNow() {
      if(REDUCE_PD||this.transitioning||!this.host.isConnected||!this.blink) return;
      const a=this.blink.animate(
        [{opacity:0,offset:0},{opacity:1,offset:.28},{opacity:1,offset:.60},{opacity:0,offset:1}],
        {duration:185,easing:'ease-in-out'}
      );
      return a;
    }
    scheduleBlink() {
      clearTimeout(this.blinkTimer);
      if(REDUCE_PD||!this.host.isConnected) return;
      this.blinkTimer=setTimeout(()=>{
        this.blinkNow();
        if(Math.random()<.16) setTimeout(()=>this.blinkNow(),rand(105,185));
        this.scheduleBlink();
      },rand(2200,5200));
    }
    setPhase(phase,force=false) {
      if(!PHASE[phase]) phase='normal';
      if(!force && phase===this.phase) return;
      this.phase=phase; this.host.dataset.pdPhase=phase;
      // 戰鬥階段照常更新，但臉部固定為 neutral，不跟著階段換表情。
      if(this.current!==FIXED_EXPR) {
        this.current=FIXED_EXPR;
        this.setLayer(this.layers[0],FIXED_EXPR);
        this.setLayer(this.layers[1],FIXED_EXPR);
      }
    }
    react(type) {
      if(this.kind==='intro'||!this.host.isConnected) return;
      // 受傷／護盾仍由既有 CSS 動畫呈現，但不更換臉部表情。
      clearTimeout(this.reactionTimer); clearTimeout(this.exprTimer);
      this.reacting=false;
      if(this.current!==FIXED_EXPR) {
        this.current=FIXED_EXPR;
        this.setLayer(this.layers[0],FIXED_EXPR);
        this.setLayer(this.layers[1],FIXED_EXPR);
      }
    }
    syncClass() {
      if(this.kind!=='battle') return;
      const p=phaseFromClass(this.host); if(p!==this.phase) this.setPhase(p);
      const hurt=this.host.classList.contains('hurt'), shield=this.host.classList.contains('shield-hit');
      if(hurt&&!this.wasHurt) this.react('hurt');
      else if(shield&&!this.wasShield) this.react('shield');
      this.wasHurt=hurt; this.wasShield=shield;
    }
  }

  function mount(el) {
    if(!el||instances.has(el)||el.classList.contains('pastel-dragon-mounted')) return;
    const kind=el.classList.contains('di-beast')?'intro':'battle';
    const inst=new PastelDragon(el,kind);
    instances.set(el,inst);
    inst.syncClass();
  }
  function scan(root=document) {
    if(root.nodeType===1 && root.matches?.('#ac-battle .ac-dragon,.dragon-intro .di-beast')) mount(root);
    root.querySelectorAll?.('#ac-battle .ac-dragon,.dragon-intro .di-beast').forEach(mount);
  }

  scan();
  const observer=new MutationObserver(muts=>{
    for(const m of muts) {
      if(m.type==='childList') m.addedNodes.forEach(n=>{ if(n.nodeType===1) scan(n); });
      else if(m.type==='attributes' && m.target?.classList?.contains('pastel-dragon-mounted')) {
        instances.get(m.target)?.syncClass();
      }
    }
  });
  observer.observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden) return;
    document.querySelectorAll('.pastel-dragon-mounted').forEach(el=>{
      const inst=instances.get(el); if(inst){ inst.scheduleBlink(); }
    });
  });
  window.PastelDragonBoss={scan};
})();
</script>

<script id="xiantaiwen-v120-runtime">
(()=>{
  'use strict';
  const root=document.documentElement;
  const blocking=()=>!!document.querySelector('.xtw-friend-ov,.cert-save-modal,.cert-name-gate,.cert-award-fx');
  const heal=()=>{
    if(blocking()) return;
    root.classList.remove('xtw-friend-lock','xw-modal-open');
    root.style.removeProperty('overflow');root.style.removeProperty('overscroll-behavior');
    if(document.body){
      document.body.style.removeProperty('overflow');document.body.style.removeProperty('overscroll-behavior');
      document.body.style.removeProperty('position');document.body.style.removeProperty('touch-action');
    }
  };
  const later=()=>setTimeout(heal,80);
  addEventListener('pageshow',later,{passive:true});
  addEventListener('hashchange',later,{passive:true});
  addEventListener('orientationchange',later,{passive:true});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)later()},{passive:true});
  document.addEventListener('click',e=>{
    if(e.target.closest('.xtw-friend-close,[data-xf-act="close"],[data-shop-close],[data-act="go"],a[href^="#"]'))later();
  },{capture:true,passive:true});
  const start=()=>{
    heal();
    if(document.body){
      new MutationObserver(later).observe(document.body,{childList:true});
    }
  };
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();
</script>

<script id="xtw-v120-final-ux">
(()=>{
  'use strict';
  const root=document.documentElement;
  const body=()=>document.body;

  /* Every “同窗冊” entry now lands on the direct friend list in the integrated hub. */
  document.addEventListener('click',e=>{
    const b=e.target.closest && e.target.closest('[data-xf-act="book"]');
    if(!b || !window.XTWFriends || typeof XTWFriends.openHub!=='function') return;
    e.preventDefault();
    e.stopImmediatePropagation();
    XTWFriends.openHub('friends');
  },true);

  /* Flatten the profile identity card and stop background video decoding. */
  let flatRAF=0;
  const flattenProfile=()=>{
    flatRAF=0;
    const card=document.querySelector('.profile-id-card');
    if(!card) return;
    card.classList.add('pid-force-flat');
    card.querySelectorAll('.pid-tilt-shell,[data-tilt-card]').forEach(el=>{
      el.classList.remove('pid-tilt-shell','tilting');
      el.removeAttribute('data-tilt-card');
      el.style.transform='none';
      ['--mx','--my','--sx','--sy','--gx','--gy','--ex','--ey','--nex','--ney','--shadow-x','--shadow-y','--parallax-x','--parallax-y'].forEach(k=>el.style.removeProperty(k));
    });
    card.querySelectorAll('.pid-sheen').forEach(el=>el.remove());
    card.querySelectorAll('.pid-media video').forEach(video=>{
      try{video.pause();}catch(_){}
      const poster=video.getAttribute('poster');
      if(poster){
        const img=document.createElement('img');
        img.className='pid-static-card';
        img.src=poster; img.alt=''; img.loading='eager'; img.decoding='async';
        video.replaceWith(img);
      }
    });
  };
  const queueFlat=()=>{if(flatRAF)return;flatRAF=requestAnimationFrame(flattenProfile);};
  queueFlat();
  const app=document.getElementById('app')||document.body;
  if(app){
    const mo=new MutationObserver(queueFlat);
    mo.observe(app,{childList:true,subtree:true});
  }

  /* Label the primary destination honestly: it is the friend book, not another menu. */
  const relabel=()=>{
    document.querySelectorAll('.xtw-hub-tab[data-hub-tab="friends"] span').forEach(el=>el.textContent='同窗冊');
  };
  new MutationObserver(relabel).observe(document.body,{childList:true,subtree:true});
  relabel();

  /* iOS safety: clear stale scroll locks only when no blocking modal exists. */
  const blockingModal=()=>document.querySelector('.xtw-friend-ov,.cert-save-modal,.cert-name-gate,.cert-award-fx');
  const healScroll=()=>{
    if(document.querySelector('.xtw-friend-ov')){
      root.classList.remove('xw-modal-open');
      return;
    }
    root.classList.remove('xtw-friend-lock');
    if(!blockingModal()){
      root.classList.remove('xw-modal-open','wl-lock','sh-lock');
      root.style.removeProperty('overflow');
      root.style.removeProperty('overscroll-behavior');
      const b=body();
      if(b){
        ['overflow','overflow-y','position','top','left','right','width','height','touch-action','overscroll-behavior'].forEach(p=>b.style.removeProperty(p));
      }
    }
  };
  ['pageshow','hashchange','orientationchange','resize'].forEach(ev=>addEventListener(ev,()=>setTimeout(healScroll,0),{passive:true}));
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(healScroll,0)},{passive:true});
  document.addEventListener('touchend',()=>setTimeout(healScroll,0),{passive:true,capture:true});
  document.addEventListener('pointerup',()=>setTimeout(healScroll,0),{passive:true,capture:true});
  setTimeout(()=>{healScroll();queueFlat();relabel();},120);
})();
</script>
